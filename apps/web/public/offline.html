<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Sin conexión · Historial de energía</title>
    <meta name="theme-color" content="#0f1115" />
    <link rel="icon" href="/icons/icon.svg" type="image/svg+xml" />
    <style>
      :root {
        color-scheme: dark;
        --bg: #0f1115;
        --panel: #171a21;
        --border: #262b36;
        --text: #e6e8ee;
        --muted: #9aa3b2;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        padding: 2rem 1rem;
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
        background: var(--bg);
        color: var(--text);
      }

      main {
        max-width: 420px;
        text-align: center;
        padding: 2rem;
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 12px;
      }

      .bolt {
        font-size: 2.5rem;
        line-height: 1;
      }

      h1 {
        font-size: 1.25rem;
        margin: 0.75rem 0 0.5rem;
      }

      p {
        margin: 0 0 1.5rem;
        color: var(--muted);
        font-size: 0.9rem;
      }

      button {
        padding: 0.6rem 1.25rem;
        border-radius: 8px;
        border: 1px solid var(--border);
        background: transparent;
        color: var(--text);
        font-size: 0.95rem;
        cursor: pointer;
      }

      button:hover {
        background: rgba(255, 255, 255, 0.05);
      }
    </style>
  </head>
  <body>
    <main>
      <div class="bolt" aria-hidden="true">⚡</div>
      <h1>Sin conexión</h1>
      <p>No se pudo contactar con el servidor. Revisa tu conexión e inténtalo de nuevo.</p>
      <button id="retry">Reintentar</button>
    </main>
    <script>
      document.getElementById("retry")?.addEventListener("click", () => {
        location.reload();
      });
    </script>
  </body>
</html>
